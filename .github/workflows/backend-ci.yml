name: Backend CI

on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: job_radar_test
          POSTGRES_USER: job_radar
          POSTGRES_PASSWORD: job_radar_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_radar"
          --health-interval 5s
          --health-tomeout 5s
          --health-retries 10s

    env:
      DATABASE_URL: postgresql+psycopg://job_radar:job_radar_dev@localhost:5432/job_radar_test
      JWT_SECRET_KEY: ci-only-dummy-secret-key-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: '30'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest